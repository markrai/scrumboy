name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test Go
        run: go test ./... -count=1 -timeout=10m

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: internal/httpapi/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: internal/httpapi/web
        run: npm ci

      - name: Test frontend
        working-directory: internal/httpapi/web
        run: npm test

      - name: Rebuild frontend from sources
        working-directory: internal/httpapi/web
        run: rm -rf dist && npm run build

      - name: Verify committed dist matches sources
        run: |
          git diff --exit-code -- internal/httpapi/web/dist
          test -z "$(git status --porcelain internal/httpapi/web/dist)"
