name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test Go
        run: go test ./... -count=1 -timeout=10m

  cli:
    name: CLI test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet CLI
        run: go vet ./cmd/scrumboy-cli

      - name: Test CLI
        run: go test ./cmd/scrumboy-cli -count=1

  cli-build:
    name: CLI cross-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Same script the release workflow uses, so a target that stops compiling
      # (or a broken packaging step) fails the PR, not the release.
      - name: Build linux/darwin/windows x amd64/arm64 archives
        run: scripts/build-cli-release.sh v0.0.0-ci cli-dist

      - name: Upload CLI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scrumboy-cli-ci
          path: cli-dist/
          retention-days: 7
          if-no-files-found: error

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            internal/httpapi/web/package-lock.json
            mobile/capacitor/package-lock.json

      - name: Install frontend dependencies
        working-directory: internal/httpapi/web
        run: npm ci

      - name: Install Capacitor dependencies for frontend tests
        working-directory: mobile/capacitor
        run: npm ci

      - name: Test frontend
        working-directory: internal/httpapi/web
        run: npm test

      - name: Install Chromium for Mermaid browser test
        working-directory: internal/httpapi/web
        run: npx playwright install --with-deps chromium

      - name: Test Mermaid browser vendor
        working-directory: internal/httpapi/web
        run: npm run test:mermaid-browser

      - name: Set up Go for inline images end-to-end
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test inline images end-to-end
        working-directory: internal/httpapi/web
        run: npm run test:inline-images

      - name: Rebuild frontend from sources
        working-directory: internal/httpapi/web
        run: rm -rf dist && npm run build

      - name: Verify committed generated files match sources
        run: |
          git diff --exit-code -- internal/httpapi/web/dist internal/httpapi/web/vendor
          test -z "$(git status --porcelain internal/httpapi/web/dist internal/httpapi/web/vendor)"
